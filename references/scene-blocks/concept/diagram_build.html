<!-- BLOCK: diagram_build | engine: gsap | aliases: concept_layers, card_stack -->
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Demo: diagram_build</title>

  <!-- Google Fonts preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- GSAP CDN with SRI -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
          integrity="sha512-7eHRwcbYkK4d9g/6tD/mhkf++eoTHwpNM9woBxtPUBWm67zeAfFC+HrdoE2GanKeocly/VxeLvIqwvCdk7qScg=="
          crossorigin="anonymous"></script>

  <style>
    /* === MotionCraft CSS Variable Convention (--mc-*) ===
     *
     * Core colors: --mc-bg, --mc-bg-alt, --mc-text, --mc-text-muted, --mc-primary, --mc-accent, --mc-border
     * Fonts: --mc-font-primary, --mc-font-secondary, --mc-heading-size, --mc-body-size
     * Spacing: --mc-spacing-sm, --mc-spacing-md, --mc-spacing-lg
     * Motion: --mc-duration-default, --mc-easing-default, --mc-enter-type, --mc-exit-type
     *
     * Rules:
     * - Each :root variable must have a fallback value (var(--mc-bg, #0a0a1a))
     * - Block demo uses default values; Template overrides default values
     * - Custom templates must define all 16+ variables
     */
    :root {
      --mc-bg: #0a0a1a;
      --mc-bg-alt: #1a1a2e;
      --mc-text: #e0e0e0;
      --mc-text-muted: #6b6b7b;
      --mc-primary: #00ff88;
      --mc-accent: #00cc6a;
      --mc-border: #2a2a3a;
      --mc-font-primary: 'Inter', sans-serif;
      --mc-font-secondary: 'JetBrains Mono', monospace;
      --mc-heading-size: 2.5rem;
      --mc-body-size: 1rem;
      --mc-spacing-sm: 0.5rem;
      --mc-spacing-md: 1rem;
      --mc-spacing-lg: 2rem;
      --mc-duration-default: 0.5;
      --mc-easing-default: power1.inOut;
      --mc-enter-type: from-hidden;
      --mc-exit-type: to-hidden;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--mc-bg, #0a0a1a);
      color: var(--mc-text, #e0e0e0);
      font-family: var(--mc-font-primary, 'Inter', sans-serif);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .scene {
      width: 1920px;
      max-width: 100vw;
      height: 1080px;
      max-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: var(--mc-spacing-lg, 2rem);
      gap: var(--mc-spacing-md, 1rem);
    }

    /* Layer base styles — CSS state model: final visible state */
    .layer-1, .layer-2, .layer-3 {
      width: 480px;
      padding: var(--mc-spacing-md, 1rem) var(--mc-spacing-lg, 2rem);
      background-color: var(--mc-bg-alt, #1a1a2e);
      border: 2px solid var(--mc-primary, #00ff88);
      border-radius: 12px;
      font-family: var(--mc-font-secondary, 'JetBrains Mono', monospace);
      font-size: var(--mc-body-size, 1rem);
      color: var(--mc-primary, #00ff88);
      text-align: center;
      /* CSS state model: final visible state */
      opacity: 1;
      transform: none;
    }

    /* Connection lines SVG container */
    .connections-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    /* Connection line styles — CSS state model: final visible state */
    .connection-1, .connection-2 {
      fill: none;
      stroke: var(--mc-border, #2a2a3a);
      stroke-width: 2;
      /* stroke-dashoffset technique for line drawing animation
       * Initial CSS hides the line by offsetting dasharray.
       * GSAP animates stroke-dashoffset from pathLength to 0 to reveal the line.
       * This is the FREE alternative to drawSVG (which is a paid GSAP plugin). */
      stroke-dasharray: 200;
      stroke-dashoffset: 0;
    }
  </style>
</head>
<body>
  <div class="scene" id="scene-demo">
    <!-- 3-layer architecture diagram -->
    <div class="layer-1">Presentation Layer</div>

    <!-- SVG connection lines between layers -->
    <svg class="connections-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet">
      <!-- connection-1: vertical line from layer-1 to layer-2 -->
      <path class="connection-1"
            d="M960 360 L960 460"
            stroke-linecap="round"/>
      <!-- connection-2: vertical line from layer-2 to layer-3 -->
      <path class="connection-2"
            d="M960 540 L960 640"
            stroke-linecap="round"/>
    </svg>

    <div class="layer-2">Logic Layer</div>
    <div class="layer-3">Data Layer</div>
  </div>

  <script>
    // ?static=true XSS-safe parsing: only check key existence, never use values in DOM
    const isStatic = new URLSearchParams(window.location.search).has('static');

    // Initialize stroke-dashoffset for connection line drawing animation
    // Uses CSS stroke-dashoffset technique (FREE), NOT drawSVG (paid GSAP plugin)
    function initConnectionPaths() {
      const paths = document.querySelectorAll('.connection-1, .connection-2');
      paths.forEach(path => {
        const pathLength = path.getTotalLength();
        // Set initial CSS: stroke-dasharray = pathLength, stroke-dashoffset = pathLength
        // This hides the line completely before animation starts
        path.style.strokeDasharray = pathLength;
        path.style.strokeDashoffset = pathLength;
      });
    }

    if (isStatic) {
      // Static mode: skip animation, show final state only
      // CSS already defines final visible state (opacity:1, transform:none)
      // Connection lines are fully visible (stroke-dashoffset: 0 in CSS)
      // No timeline creation needed
    } else {
      // diagram_build — Pattern P5: Diagram Build
      // Easing: power1.inOut (smooth transitions)
      // Each layer: 0.4-0.6s (default 0.5s)
      // Connection line: 0.6-1.0s (default 0.8s)
      // Layer overlap: 0.2-0.3s (default 0.25s)

      initConnectionPaths();

      const tl = gsap.timeline({ paused: true });

      // Layer 1 appears
      tl.from('.layer-1', {
        opacity: 0,
        y: 20,
        duration: 0.5,
        ease: 'power1.inOut'
      })
      // Layer 2 appears (overlap 0.25s)
      .from('.layer-2', {
        opacity: 0,
        y: 20,
        duration: 0.5,
        ease: 'power1.inOut'
      }, '-=0.25')
      // Connection 1 draws (CSS stroke-dashoffset animation, overlap 0.25s)
      .to('.connection-1', {
        strokeDashoffset: 0,
        duration: 0.8,
        ease: 'power1.inOut'
      }, '-=0.25')
      // Layer 3 appears (overlap 0.25s)
      .from('.layer-3', {
        opacity: 0,
        y: 20,
        duration: 0.5,
        ease: 'power1.inOut'
      }, '-=0.25')
      // Connection 2 draws (CSS stroke-dashoffset animation, overlap 0.25s)
      .to('.connection-2', {
        strokeDashoffset: 0,
        duration: 0.8,
        ease: 'power1.inOut'
      }, '-=0.25');

      <!-- DEMO-ONLY -->
      window.__timelines = window.__timelines || {};
      window.__timelines['block-demo-diagram_build'] = tl;
      tl.play();
      <!-- END DEMO-ONLY -->
    }
  </script>
</body>
</html>
