<!-- BLOCK: number_count | engine: gsap | aliases: data_dashboard -->
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Demo: number_count</title>

  <!-- Google Fonts preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- GSAP CDN with SRI -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
          integrity="sha512-7eHRwcbYkK4d9g/6tD/mhkf++eoTHwpNM9woBxtPUBWm67zeAfFC+HrdoE2GanKeocly/VxeLvIqwvCdk7qScg=="
          crossorigin="anonymous"></script>

  <style>
    /* === MotionCraft CSS Variable Convention (--mc-*) ===
     *
     * Core colors: --mc-bg, --mc-bg-alt, --mc-text, --mc-text-muted, --mc-primary, --mc-accent, --mc-border
     * Fonts: --mc-font-primary, --mc-font-secondary, --mc-heading-size, --mc-body-size
     * Spacing: --mc-spacing-sm, --mc-spacing-md, --mc-spacing-lg
     * Motion: --mc-duration-default, --mc-easing-default, --mc-enter-type, --mc-exit-type
     *
     * Rules:
     * - Each :root variable must have a fallback value (var(--mc-bg, #0a0a1a))
     * - Block demo uses default values; Template overrides default values
     * - Custom templates must define all 16+ variables
     */
    :root {
      --mc-bg: #0a0a1a;
      --mc-bg-alt: #1a1a2e;
      --mc-text: #e0e0e0;
      --mc-text-muted: #6b6b7b;
      --mc-primary: #00ff88;
      --mc-accent: #00cc6a;
      --mc-border: #2a2a3a;
      --mc-font-primary: 'Inter', sans-serif;
      --mc-font-secondary: 'JetBrains Mono', monospace;
      --mc-heading-size: 2.5rem;
      --mc-body-size: 1rem;
      --mc-spacing-sm: 0.5rem;
      --mc-spacing-md: 1rem;
      --mc-spacing-lg: 2rem;
      --mc-duration-default: 1.5;
      --mc-easing-default: power1.out;
      --mc-enter-type: from-zero;
      --mc-exit-type: to-hidden;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--mc-bg, #0a0a1a);
      color: var(--mc-text, #e0e0e0);
      font-family: var(--mc-font-primary, 'Inter', sans-serif);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .scene {
      width: 1920px;
      max-width: 100vw;
      height: 1080px;
      max-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: var(--mc-spacing-lg, 2rem);
    }

    .metric {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--mc-spacing-sm, 0.5rem);
    }

    .metric-label {
      font-size: var(--mc-body-size, 1rem);
      color: var(--mc-text-muted, #6b6b7b);
      font-family: var(--mc-font-primary, 'Inter', sans-serif);
      font-weight: 400;
      letter-spacing: 0.05em;
      /* CSS state model: final visible state */
      opacity: 1;
      transform: none;
    }

    .metric-number {
      font-size: var(--mc-heading-size, 2.5rem);
      font-weight: 700;
      color: var(--mc-primary, #00ff88);
      font-family: var(--mc-font-secondary, 'JetBrains Mono', monospace);
      /* CSS state model: final visible state — number visible at target value position
         GSAP animates FROM 0 (counter {value: 0} → target) */
      opacity: 1;
      transform: none;
    }

    .metric-unit {
      font-size: 0.875rem;
      color: var(--mc-text-muted, #6b6b7b);
      font-family: var(--mc-font-secondary, 'JetBrains Mono', monospace);
      font-weight: 400;
      /* CSS state model */
      opacity: 1;
      transform: none;
    }
  </style>
</head>
<body>
  <div class="scene" id="scene-demo">
    <div class="metric">
      <div class="metric-label">月活用户</div>
      <div class="metric-number">12,847</div>
      <div class="metric-unit">人</div>
    </div>
  </div>

  <script>
    // ?static=true XSS-safe parsing: only check key existence, never use values in DOM
    const isStatic = new URLSearchParams(window.location.search).has('static');

    if (isStatic) {
      // Static mode: skip animation, show final state only
      // CSS already defines final visible state (opacity:1, transform:none)
      // Number already shows formatted target value "12,847" in HTML
      // No timeline creation needed
    } else {
      // number_count — Pattern P4: Number Count
      // Easing: power1.out (先快后慢, 符合"越来越接近目标"的心理预期)
      // Duration: 1.0-2.0s (default 1.5s)
      // counter {value: 0} → target, onUpdate formats with locale string
      const counter = { value: 0 };
      const targetValue = 12847;
      const numberEl = document.querySelector('.metric-number');

      const tl = gsap.timeline({ paused: true });

      // Phase 1: label fades in
      tl.from('.metric-label', {
        opacity: 0,
        y: 10,
        duration: 0.4,
        ease: 'power2.out'
      });

      // Phase 2: number counts from 0 to target
      tl.to(counter, {
        value: targetValue,
        duration: 1.5,
        ease: 'power1.out',
        onUpdate: () => {
          numberEl.textContent = Math.round(counter.value).toLocaleString();
        }
      }, '-=0.1');

      // Hold ≥ 0.5s after count completes
      tl.to({}, { duration: 0.5 });

      <!-- DEMO-ONLY -->
      window.__timelines = window.__timelines || {};
      window.__timelines['block-demo-number_count'] = tl;
      tl.play();
      <!-- END DEMO-ONLY -->
    }
  </script>
</body>
</html>
