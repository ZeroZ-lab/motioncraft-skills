<!-- BLOCK: line_draw | engine: gsap | aliases: flow_build, pipeline_sequence -->
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Demo: line_draw</title>

  <!-- Google Fonts preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- GSAP CDN with SRI -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
          integrity="sha512-7eHRwcbYkK4d9g/6tD/mhkf++eoTHwpNM9woBxtPUBWm67zeAfFC+HrdoE2GanKeocly/VxeLvIqwvCdk7qScg=="
          crossorigin="anonymous"></script>

  <style>
    /* === MotionCraft CSS Variable Convention (--mc-*) ===
     *
     * Core colors: --mc-bg, --mc-bg-alt, --mc-text, --mc-text-muted, --mc-primary, --mc-accent, --mc-border
     * Fonts: --mc-font-primary, --mc-font-secondary, --mc-heading-size, --mc-body-size
     * Spacing: --mc-spacing-sm, --mc-spacing-md, --mc-spacing-lg
     * Motion: --mc-duration-default, --mc-easing-default, --mc-enter-type, --mc-exit-type
     *
     * Rules:
     * - Each :root variable must have a fallback value (var(--mc-bg, #0a0a1a))
     * - Block demo uses default values; Template overrides default values
     * - Custom templates must define all 16+ variables
     */
    :root {
      --mc-bg: #0a0a1a;
      --mc-bg-alt: #1a1a2e;
      --mc-text: #e0e0e0;
      --mc-text-muted: #6b6b7b;
      --mc-primary: #00ff88;
      --mc-accent: #00cc6a;
      --mc-border: #2a2a3a;
      --mc-font-primary: 'Inter', sans-serif;
      --mc-font-secondary: 'JetBrains Mono', monospace;
      --mc-heading-size: 2.5rem;
      --mc-body-size: 1rem;
      --mc-spacing-sm: 0.5rem;
      --mc-spacing-md: 1rem;
      --mc-spacing-lg: 2rem;
      --mc-duration-default: 1.0;
      --mc-easing-default: power1.inOut;
      --mc-enter-type: from-hidden;
      --mc-exit-type: to-hidden;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--mc-bg, #0a0a1a);
      color: var(--mc-text, #e0e0e0);
      font-family: var(--mc-font-primary, 'Inter', sans-serif);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .scene {
      width: 1920px;
      max-width: 100vw;
      height: 1080px;
      max-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: var(--mc-spacing-lg, 2rem);
    }

    .flow-diagram {
      width: 80%;
      max-width: 800px;
      height: auto;
    }

    /* line_draw: CSS stroke-dashoffset technique (free, NOT drawSVG plugin)
     *
     * CRITICAL: stroke-dasharray and stroke-dashoffset are set via JS
     * using path.getTotalLength(). CSS declares the initial hidden state
     * as stroke-dashoffset equal to dasharray (path invisible),
     * then GSAP animates strokeDashoffset to 0 (path fully visible).
     *
     * The fallback value here is a large number; JS will replace it
     * with the exact computed path length at runtime.
     */
    .flow-path {
      stroke: var(--mc-primary, #00ff88);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      /* JS sets dasharray/dashoffset to path.getTotalLength().
         CSS state model: final state is strokeDashoffset: 0 (fully visible).
         Initial state: strokeDashoffset = dasharray (fully hidden). */
      stroke-dasharray: 9999;
      stroke-dashoffset: 9999;
    }

    .flow-node {
      fill: var(--mc-accent, #00cc6a);
      stroke: var(--mc-primary, #00ff88);
      stroke-width: 2;
      /* CSS state model: final visible state */
      opacity: 1;
      transform-origin: center;
      transform: scale(1);
    }

    .node-label {
      fill: var(--mc-text, #e0e0e0);
      font-family: var(--mc-font-secondary, 'JetBrains Mono', monospace);
      font-size: 12px;
      text-anchor: middle;
    }
  </style>
</head>
<body>
  <div class="scene" id="scene-demo">
    <svg class="flow-diagram" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
      <!-- Start node -->
      <circle class="flow-node" cx="60" cy="100" r="20" />
      <text class="node-label" x="60" y="105">Start</text>

      <!-- Curved flow path -->
      <path class="flow-path" d="M 80 100 C 200 40, 350 160, 520 100" />

      <!-- End node -->
      <circle class="flow-node" cx="540" cy="100" r="20" />
      <text class="node-label" x="540" y="105">End</text>
    </svg>
  </div>

  <script>
    // ?static=true XSS-safe parsing: only check key existence, never use values in DOM
    const isStatic = new URLSearchParams(window.location.search).has('static');

    // Compute path lengths and set CSS dasharray/dashoffset
    const flowPaths = document.querySelectorAll('.flow-path');
    const pathLengths = [];
    flowPaths.forEach(function(path) {
      var len = path.getTotalLength();
      pathLengths.push(len);
      // Set exact computed length as dasharray and dashoffset
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = len;
    });

    if (isStatic) {
      // Static mode: show final state (path fully visible, nodes visible)
      // Override dashoffset to 0 so path is drawn
      flowPaths.forEach(function(path) {
        path.style.strokeDashoffset = '0';
      });
      // CSS already defines nodes at opacity:1, scale:1
    } else {
      // line_draw — Pattern: Line Draw (strokeDashoffset technique)
      // Easing: power1.inOut (balanced draw speed)
      // Duration: 0.8-1.5s (default 1.0s)
      // Timeline: nodes appear first, then path draws from start to end

      const tl = gsap.timeline({ paused: true });

      // Step 1: Nodes appear (opacity + scale)
      tl.from('.flow-node', {
        opacity: 0,
        scale: 0.5,
        duration: 0.4,
        stagger: 0.25,
        ease: 'back.out(1.7)'
      })
      // Step 2: Path draws from start to end (strokeDashoffset: pathLength → 0)
      .from('.flow-path', {
        strokeDashoffset: function(i) { return pathLengths[i]; },
        duration: 1.0,
        ease: 'power1.inOut'
      }, '-=0.1');

      <!-- DEMO-ONLY -->
      window.__timelines = window.__timelines || {};
      window.__timelines['block-demo-line_draw'] = tl;
      tl.play();
      <!-- END DEMO-ONLY -->
    }
  </script>
</body>
</html>
