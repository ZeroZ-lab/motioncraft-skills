<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Tech — MotionCraft Template</title>

  <!-- Google Fonts: preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Google Fonts: Inter + JetBrains Mono (dynamic CSS, no SRI) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- GSAP CDN with SRI -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
    integrity="sha512-7eHRwcbYkK4d9g/6tD/mhkf++eoTHwpNM9woBxtPUBWm67zeAfFC+HrdoE2GanKeocly/VxeLvIqwvCdk7qScg=="
    crossorigin="anonymous"
  ></script>

  <!-- Template styles & motion -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HyperFrames root container -->
  <div
    class="video-container"
    data-composition-id="PLACEHOLDER_COMPOSITION_ID"
    data-start="0"
    data-width="1920"
    data-height="1080"
  >
    <!-- Scene placeholder -->
    <div class="scene" id="scene-01">
    </div>
  </div>

  <!-- Motion engine -->
  <script src="motion.js"></script>

</body>
</html>
